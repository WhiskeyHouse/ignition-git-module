name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '18'

jobs:
  release:
    name: Build, Sign & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version info
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT

          # Detect pre-release: contains a hyphen after the version triplet
          if [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "Detected pre-release: $TAG_VERSION"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "Detected stable release: $TAG_VERSION"
          fi

          echo "Tag version for module: $TAG_VERSION"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set version from tag
        run: |
          TAG_VERSION="${{ steps.version.outputs.tag_version }}"
          POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)

          if [ "$POM_VERSION" != "$TAG_VERSION" ]; then
            echo "POM version ($POM_VERSION) differs from tag ($TAG_VERSION) — updating to match tag"
            mvn versions:set -DnewVersion="$TAG_VERSION" -DgenerateBackupPoms=false -q
          else
            echo "POM version already matches tag: $TAG_VERSION"
          fi

      - name: Build module
        run: |
          mvn clean package -DskipTests -Dmodule.version=${{ steps.version.outputs.tag_version }}
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Preserve unsigned module
        run: |
          cd git-build/target
          MODL_FILE=$(ls *.modl | head -1)
          if [ -n "$MODL_FILE" ]; then
            cp "$MODL_FILE" "Git-${{ steps.version.outputs.tag_version }}-unsigned.modl"
            echo "Preserved unsigned module: Git-${{ steps.version.outputs.tag_version }}-unsigned.modl"
            ls -lh "Git-${{ steps.version.outputs.tag_version }}-unsigned.modl"
          else
            echo "Error: No .modl file found"
            exit 1
          fi

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ runner.temp }}/keystore.jks

      - name: Sign module
        if: env.HAS_KEYSTORE == 'true'
        run: |
          cd git-build/target
          MODL_FILE=$(ls *.modl | grep -v "unsigned" | head -1)
          if [ -n "$MODL_FILE" ]; then
            jarsigner -keystore ${{ runner.temp }}/keystore.jks \
              -storepass "${{ secrets.KEYSTORE_STOREPASS }}" \
              -keypass "${{ secrets.KEYSTORE_KEYPASS }}" \
              -verbose \
              "$MODL_FILE" \
              "${{ secrets.KEYSTORE_ALIAS }}"
            echo "Signed module: $MODL_FILE"
          else
            echo "Error: No .modl file found to sign"
            exit 1
          fi
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Verify signed module
        if: env.HAS_KEYSTORE == 'true'
        run: |
          cd git-build/target
          MODL_FILE=$(ls *.modl | grep -v "unsigned" | head -1)
          if [ -n "$MODL_FILE" ]; then
            jarsigner -verify -verbose -certs "$MODL_FILE"
            echo "Module signature verified successfully"
          fi

      - name: Rename signed module
        if: env.HAS_KEYSTORE == 'true'
        run: |
          cd git-build/target
          MODL_FILE=$(ls *.modl | grep -v "unsigned" | head -1)
          if [ -n "$MODL_FILE" ]; then
            mv "$MODL_FILE" "Git-${{ steps.version.outputs.tag_version }}-signed.modl"
            echo "Renamed signed module: Git-${{ steps.version.outputs.tag_version }}-signed.modl"
            ls -lh Git-*.modl
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ignition-git-module-${{ steps.version.outputs.tag_version }}
          path: git-build/target/Git-${{ steps.version.outputs.tag_version }}-*.modl
          retention-days: 90

      - name: Generate release notes
        run: |
          gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="v${{ steps.version.outputs.tag_version }}" \
            --jq '.body' > ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        run: |
          python3 << 'PYEOF'
          import xml.sax.saxutils as saxutils
          import os

          version = os.environ["VERSION"]
          repo = os.environ["REPO"]

          with open(os.environ["NOTES_FILE"]) as f:
              desc = saxutils.escape(f.read().strip())

          pom = "\n".join([
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<project xmlns="http://maven.apache.org/POM/4.0.0">',
              "  <modelVersion>4.0.0</modelVersion>",
              "  <groupId>com.axone_io.ignition</groupId>",
              "  <artifactId>git-module</artifactId>",
              f"  <version>{version}</version>",
              "  <packaging>modl</packaging>",
              "  <name>Ignition Git Module</name>",
              f"  <description>{desc}</description>",
              f"  <url>https://github.com/{repo}</url>",
              "</project>",
          ])

          with open(os.environ["POM_FILE"], "w") as f:
              f.write(pom)
          PYEOF

          if [ -f "git-build/target/Git-${VERSION}-signed.modl" ]; then
            MODL_FILE="git-build/target/Git-${VERSION}-signed.modl"
          else
            MODL_FILE="git-build/target/Git-${VERSION}-unsigned.modl"
          fi

          mvn deploy:deploy-file \
            -DpomFile="${POM_FILE}" \
            -Dfile="$MODL_FILE" \
            -DrepositoryId=github \
            -Durl="https://maven.pkg.github.com/${REPO}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.tag_version }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
          POM_FILE: ${{ runner.temp }}/deploy-pom.xml
          REPO: ${{ github.repository }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            git-build/target/Git-${{ steps.version.outputs.tag_version }}-*.modl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always() && env.HAS_KEYSTORE == 'true'
        run: |
          rm -f ${{ runner.temp }}/keystore.jks
