name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '18'

jobs:
  release:
    name: Build, Sign & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version info
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT

          if [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "Detected pre-release: $TAG_VERSION"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "Detected stable release: $TAG_VERSION"
          fi

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set version from tag
        run: |
          TAG_VERSION="${{ steps.version.outputs.tag_version }}"
          POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)

          if [ "$POM_VERSION" != "$TAG_VERSION" ]; then
            echo "POM version ($POM_VERSION) differs from tag ($TAG_VERSION) — updating to match tag"
            mvn versions:set -DnewVersion="$TAG_VERSION" -DgenerateBackupPoms=false -q
          else
            echo "POM version already matches tag: $TAG_VERSION"
          fi

      # Decode keystore before build so Maven -Psign profile can use it
      - name: Decode keystore
        id: keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ runner.temp }}/keystore.jks
          echo "available=true" >> $GITHUB_OUTPUT

      - name: Build and sign module
        run: |
          TAG_VERSION="${{ steps.version.outputs.tag_version }}"
          MVN_ARGS="clean package -DskipTests -Dmodule.version=$TAG_VERSION"

          if [ "${{ steps.keystore.outputs.available }}" = "true" ]; then
            echo "Building with code signing enabled (-Psign)"
            mvn $MVN_ARGS -Psign \
              -Dkeystore.path=${{ runner.temp }}/keystore.jks \
              -Dkeystore.alias="${{ secrets.KEYSTORE_ALIAS }}" \
              -Dkeystore.storepass="${{ secrets.KEYSTORE_STOREPASS }}" \
              -Dkeystore.keypass="${{ secrets.KEYSTORE_KEYPASS }}"
          else
            echo "::warning::Building WITHOUT code signing — configure KEYSTORE_BASE64 secret to enable"
            mvn $MVN_ARGS
          fi

      - name: Verify signature
        if: steps.keystore.outputs.available == 'true'
        run: |
          jarsigner -verify -verbose -certs git-build/target/Git-unsigned.modl
          echo "Module signature verified"

      - name: Prepare release artifacts
        id: artifacts
        run: |
          TAG_VERSION="${{ steps.version.outputs.tag_version }}"
          cd git-build/target

          if [ "${{ steps.keystore.outputs.available }}" = "true" ]; then
            cp Git-unsigned.modl "Git-${TAG_VERSION}-signed.modl"
            echo "release_modl=git-build/target/Git-${TAG_VERSION}-signed.modl" >> $GITHUB_OUTPUT
          else
            cp Git-unsigned.modl "Git-${TAG_VERSION}-unsigned.modl"
            echo "release_modl=git-build/target/Git-${TAG_VERSION}-unsigned.modl" >> $GITHUB_OUTPUT
          fi

          ls -lh Git-${TAG_VERSION}-*.modl

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ignition-git-module-${{ steps.version.outputs.tag_version }}
          path: git-build/target/Git-${{ steps.version.outputs.tag_version }}-*.modl
          retention-days: 90

      - name: Generate release notes
        run: |
          gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="v${{ steps.version.outputs.tag_version }}" \
            --jq '.body' > ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        run: |
          python3 << 'PYEOF'
          import xml.sax.saxutils as saxutils
          import os

          version = os.environ["VERSION"]
          repo = os.environ["REPO"]

          with open(os.environ["NOTES_FILE"]) as f:
              desc = saxutils.escape(f.read().strip())

          pom = "\n".join([
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<project xmlns="http://maven.apache.org/POM/4.0.0">',
              "  <modelVersion>4.0.0</modelVersion>",
              "  <groupId>com.axone_io.ignition</groupId>",
              "  <artifactId>git-module</artifactId>",
              f"  <version>{version}</version>",
              "  <packaging>modl</packaging>",
              "  <name>Ignition Git Module</name>",
              f"  <description>{desc}</description>",
              f"  <url>https://github.com/{repo}</url>",
              "</project>",
          ])

          with open(os.environ["POM_FILE"], "w") as f:
              f.write(pom)
          PYEOF

          mvn deploy:deploy-file \
            -DpomFile="${POM_FILE}" \
            -Dfile="${RELEASE_MODL}" \
            -DrepositoryId=github \
            -Durl="https://maven.pkg.github.com/${REPO}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.tag_version }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
          POM_FILE: ${{ runner.temp }}/deploy-pom.xml
          REPO: ${{ github.repository }}
          RELEASE_MODL: ${{ steps.artifacts.outputs.release_modl }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            git-build/target/Git-${{ steps.version.outputs.tag_version }}-*.modl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always() && steps.keystore.outputs.available == 'true'
        run: |
          rm -f ${{ runner.temp }}/keystore.jks
